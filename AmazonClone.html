<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="Amazon.css">
</head>
<body>
    <header>
        <nav class="nav">
            <div class="nav-upper-div">
                <!-- logo -->
                <div class="logo bdr-hvr hght-pad">
                    <div class="logo-image">
                        <a href="#">
                            <img src="Img/Amazon_logo.svg" alt="Amazon-logo">
                            <span>.in</span>
                        </a>
                    </div>
                </div>
                <!-- location -->
                <div class="location bdr-hvr hght-pad">
                    <a href="#">
                        <div class="location-icon">
                            <img src="Img/location-pin-svgrepo-com.svg" alt="location-icon">
                        </div>
                        <div class="address">
                            <span>Delivering to Mumbai 400093</span>
                            <span>Update location</span>
                        </div>
                    </a>
                </div>
                <!-- search-bar -->
                <div class="search-bar hght-pad">
                    <form action="#" class="search-form">
                        <div class="search-dropdown">
                            <div>
                                <span>All</span>
                                <i class="dropdown-i"></i>
                            </div>
                            <div class="select-dropdown">
                                <select name="url" id="dropdown">
                                    <option value=""></option>
                                </select>
                            </div>
                        </div>
                        <div class="search-input">
                            <input type="text" name="search" id="search-in" placeholder="Search Amazon.in">
                        </div>
                        <div class="search-btn">
                            <button type="submit" class="search-btn-input">
                                <img src="Img/search-icon.png" alt="search-icon">
                            </button>
                        </div>
                    </form>
                </div>
                <!-- nav-right -->
                <div class="nav-right">
                    <div class="country bdr-hvr">
                        <a href="#">
                            <span class="flag">
                                <img src="Img/india-flag-icon.svg" alt="country-flag">
                            </span>
                            <span class="language">EN</span>
                            <i class="dropdown-i"></i>
                        </a>
                    </div>
                    <!-- accounts and list -->
                    <div class="bdr-hvr hght-pad">
                        <div class="accounts">
                            <a href="#">
                                <div class="sign-span">
                                    <span>Hello, sign in</span>
                                    <span>
                                        <span>Account & Lists</span>
                                        <i class="dropdown-i"></i>
                                    </span>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="bdr-hvr hght-pad">
                        <div class="returns-orders">
                            <a href="#">
                                <div class="rtrn-ordr-div">
                                    <span>Returns</span>
                                    <div>
                                        <span>& Orders</span>
                                    </div>
                                </div>
                            </a>
                        </div>
                    </div>
                    <div class="cart bdr-hvr hght-pad">
                        <div class="cart-img">
                            <a href="#">
                                <div>
                                    <p>0</p>
                                    <img src="Img/Cart.png" alt="cart-icon">
                                    <span>Cart</span>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div></div>
        </nav>
    </header>
    <script src="amazon.js"></script>
</body>
</html>
