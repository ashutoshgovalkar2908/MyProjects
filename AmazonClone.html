<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="Amazon.css">
</head>
<body>
    <header>
        <nav class="nav">
            <div class="nav-upper-div">
                <!-- logo -->
                <div class="logo bdr-hvr">
                    <div class="logo-image">
                        <a href="#">
                            <img src="Img/Amazon_logo.svg" alt="Amazon-logo">
                            <span>.in</span>
                        </a>
                    </div>
                </div>
                <!-- location -->
                <div class="location bdr-hvr">
                    <a href="#">
                        <div class="location-icon">
                            <img src="Img/location-pin-svgrepo-com.svg" alt="">
                        </div>
                        <div class="address">
                            <span>Delivering to Mumbai 400093</span>
                            <span>Update location</span>
                        </div>
                    </a>
                </div>
                <!-- search-baar -->
                <div class="search-baar">
                    <form action="#">
                        <div class="search-dropdown">
                            <div>
                                <span>All</span>
                                <i></i>
                            </div>
                            <div class="select-dropdown">
                                <select name="url" id="dropdown"></select>
                            </div>
                        </div>
                        <div class="search-input">
                            <input type="text" name="" id="" placeholder="Search Amazon.in">
                        </div>
                        <div class="search-btn">
                            <input type="text" name="" id="" class="search-btn-input">
                            <img src="Img/search-icon.png" alt="">
                        </div>
                    </form>
                </div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div></div>
        </nav>
    </header>
</body>
</html>
